<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>RAG 90 秒答题卡</title>
  <style>
    :root { --ink:#151515; --paper:#f6f3ed; --panel:#fff; --line:#d8ccbd; --blue:#2454a6; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; line-height:1.55; }
    main { width:min(960px,calc(100vw - 36px)); margin:0 auto; padding:34px 0 46px; }
    h1 { font-family:Georgia,"Noto Serif SC",serif; font-size:44px; line-height:1.05; margin:0 0 16px; letter-spacing:0; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
    h2 { margin:0 0 8px; color:var(--blue); font-size:20px; }
    p { margin:0; }
    .wide { grid-column:1 / -1; border:2px solid var(--blue); }
    @media (max-width:780px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>RAG 90 秒答题卡</h1>
    <div class="grid">
      <section><h2>1. 定义</h2><p>RAG 是先检索外部资料，再把相关上下文交给模型生成答案。</p></section>
      <section><h2>2. 链路</h2><p>query -> retrieve -> rerank -> assemble context -> generate -> evaluate。</p></section>
      <section><h2>3. 价值</h2><p>补充新知识、支持引用、降低纯参数记忆依赖。</p></section>
      <section><h2>4. 边界</h2><p>召回不到、上下文污染、模型不遵循资料时仍会错。</p></section>
      <section class="wide"><h2>收束句</h2><p>所以我不会说 RAG 消灭幻觉，我会说它把问题拆成可诊断的检索、上下文和生成环节。</p></section>
    </div>
  </main>
</body>
</html>
