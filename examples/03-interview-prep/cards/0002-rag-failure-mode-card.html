<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>RAG 失败模式面试卡</title>
  <style>
    :root { --ink:#151515; --paper:#f8f4ed; --panel:#fff; --line:#d8ccbd; --orange:#b45309; --green:#13795b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; line-height:1.55; }
    main { width:min(980px,calc(100vw - 36px)); margin:0 auto; padding:34px 0 46px; }
    h1 { font-family:Georgia,"Noto Serif SC",serif; font-size:44px; line-height:1.05; margin:0 0 16px; letter-spacing:0; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
    th,td { border-bottom:1px solid var(--line); padding:12px 10px; text-align:left; vertical-align:top; }
    th { color:var(--orange); }
    .good { color:var(--green); font-weight:850; }
  </style>
</head>
<body>
  <main>
    <h1>RAG 失败模式面试卡</h1>
    <table>
      <thead><tr><th>问题</th><th>先看什么</th><th>再怎么修</th></tr></thead>
      <tbody>
        <tr><td>召回不到</td><td>query、chunk、embedding、top-k、filter。</td><td class="good">补 query rewrite、调 chunk、加 rerank。</td></tr>
        <tr><td>上下文污染</td><td>无关 chunk、重复资料、冲突资料。</td><td class="good">rerank、去重、压缩上下文、加引用选择。</td></tr>
        <tr><td>生成不遵循资料</td><td>prompt 约束、答案格式、拒答规则。</td><td class="good">要求引用、限制回答范围、无资料时拒答。</td></tr>
        <tr><td>延迟高</td><td>检索、rerank、上下文长度、生成 token。</td><td class="good">分段优化，不盲目换模型。</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
