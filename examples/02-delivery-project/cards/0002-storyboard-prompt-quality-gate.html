<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>分镜提示词质量门禁卡</title>
  <style>
    :root { --ink:#151515; --paper:#f7f3ec; --panel:#fff; --line:#d7cbbb; --green:#13795b; --red:#b7352d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; line-height:1.55; }
    main { width:min(980px,calc(100vw - 36px)); margin:0 auto; padding:34px 0 46px; }
    h1 { font-family:Georgia,"Noto Serif SC",serif; font-size:44px; line-height:1.05; margin:0 0 16px; letter-spacing:0; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    th,td { border-bottom:1px solid var(--line); padding:12px 10px; text-align:left; vertical-align:top; }
    th { color:var(--green); }
    tr:last-child td { border-bottom:0; }
    .fail { color:var(--red); font-weight:850; }
    .pass { color:var(--green); font-weight:850; }
  </style>
</head>
<body>
  <main>
    <h1>分镜提示词质量门禁卡</h1>
    <table>
      <thead>
        <tr><th>门禁</th><th>通过标准</th><th>常见失败</th></tr>
      </thead>
      <tbody>
        <tr><td>事实锁定</td><td class="pass">事实来自图片或用户说明。</td><td class="fail">凭空添加 logo、人物身份、隐藏物体。</td></tr>
        <tr><td>创作推断</td><td class="pass">推断写在 Creative Intent。</td><td class="fail">把品牌意图写成画面事实。</td></tr>
        <tr><td>镜头连续</td><td class="pass">主体、环境、光线方向一致。</td><td class="fail">每镜都像新图片，主体变形或换场景。</td></tr>
        <tr><td>可执行性</td><td class="pass">每镜都有主体、动作、机位、光线。</td><td class="fail">只有“高级、电影感、震撼”这类空词。</td></tr>
        <tr><td>负面约束</td><td class="pass">针对图片风险写约束。</td><td class="fail">统一复制一串无关负面词。</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
