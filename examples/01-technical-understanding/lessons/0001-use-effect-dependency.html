<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0001 · useEffect 依赖数组</title>
  <style>
    body { margin:0; background:#f8f7f2; color:#111; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; line-height:1.6; }
    main { width:min(920px,calc(100vw - 40px)); margin:0 auto; padding:40px 0 56px; }
    h1 { margin:0 0 18px; font-family:Georgia,"Noto Serif SC",serif; font-size:46px; line-height:1.05; }
    .box { background:#fff; border:1px solid #111; padding:16px; margin:14px 0; }
    button { border:1px solid #111; background:#005f73; color:#fff; padding:10px 12px; font:inherit; cursor:pointer; }
    #feedback { margin-top:12px; font-weight:700; }
    code { background:rgba(0,0,0,.07); padding:2px 5px; }
  </style>
</head>
<body>
  <main>
    <h1>useEffect 依赖数组</h1>
    <p>这一节只学一个判断：effect 里读到的响应式值，通常就应该进入依赖数组。</p>
    <section class="box">
      <p><code>useEffect(() =&gt; { send(userId) }, [])</code> 里读取了 <code>userId</code>，但依赖数组为空。风险是用户切换后 effect 仍使用旧值。</p>
    </section>
    <section class="box">
      <p>练习：这个 effect 应该依赖什么？</p>
      <button>查看答案</button>
      <div id="feedback"></div>
    </section>
  </main>
  <script>
    document.querySelector("button").addEventListener("click", () => {
      document.querySelector("#feedback").textContent = "至少依赖 userId。判断标准不是“我想不想重新执行”，而是 effect 读了哪些响应式值。";
    });
  </script>
</body>
</html>
