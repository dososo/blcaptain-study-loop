<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>useEffect 依赖判断卡</title>
  <style>
    body { margin:0; background:#f8f7f2; color:#111; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; line-height:1.6; }
    main { width:min(820px,calc(100vw - 40px)); margin:0 auto; padding:40px 0; }
    h1 { font-family:Georgia,"Noto Serif SC",serif; font-size:40px; margin:0 0 14px; }
    .box { background:#fff; border:1px solid #111; padding:16px; }
    li { margin:8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>useEffect 依赖判断卡</h1>
    <div class="box">
      <ol>
        <li>effect 里读了哪些 props、state、组件内变量或函数？</li>
        <li>这些值变化时，effect 是否应该看到新值？</li>
        <li>如果不想触发 effect，先重构逻辑，而不是删依赖。</li>
      </ol>
    </div>
  </main>
</body>
</html>
